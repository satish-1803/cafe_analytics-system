<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff login</title>
<style>:root{--bg:#eef2f1;--card:#fff;--ink:#0f3d3e;--sa:#f2a900}@media(prefers-color-scheme:dark){:root{--bg:#0c1f20;--card:#14302f;--ink:#d7ecea}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
form{background:var(--card);padding:24px;border-radius:14px;width:min(320px,90vw);display:grid;gap:12px}h1{margin:0;font:700 24px Georgia,serif}
input,button{padding:12px;border-radius:8px;border:1px solid #8aa;font:inherit}button{background:var(--sa);border:0;font-weight:600;cursor:pointer}#e{color:#c8412b;min-height:1em;margin:0}</style></head><body>
<form id="f"><h1>Staff login</h1><input id="u" placeholder="Username" autocomplete="username" required><input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
<p id="e" role="alert"></p><button>Log in</button></form>
<script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});
if(r.ok)location="/admin";else document.getElementById("e").textContent=(await r.json()).detail}</script></body></html>
